[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devnote"
version = "0.1.0"
description = "Interactive Developer Notebook & Coding Workspace"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "DevNote Team" }
]
keywords = [
    "notebook",
    "developer",
    "fastapi",
    "python",
    "javascript",
    "code-editor",
    "apple-pencil",
    "ipad"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
    "Topic :: Software Development :: Interpreters",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "pymupdf>=1.24.0",
    "reportlab>=4.1.0",
    "pygments>=2.17.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/devnote-team/devnote"
Documentation = "https://github.com/devnote-team/devnote#readme"
Repository = "https://github.com/devnote-team/devnote"
Issues = "https://github.com/devnote-team/devnote/issues"

[project.scripts]
devnote = "devnote.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["devnote*"]

[tool.setuptools.package-data]
devnote = [
    "frontend/**/*",
    "frontend/*",
]
