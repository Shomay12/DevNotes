<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="glow-1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      .blink-cursor {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .pulse-glow {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.98); opacity: 0.6; }
        100% { transform: scale(1.02); opacity: 0.9; }
      }
      .tag-hover {
        transition: transform 0.2s ease;
      }
      .tag-hover:hover {
        transform: translateY(-2px);
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="940" height="320" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Glowing Orbs -->
  <circle cx="160" cy="90" r="140" fill="url(#glow-1)" class="pulse-glow"/>
  <circle cx="760" cy="220" r="160" fill="url(#glow-2)" class="pulse-glow"/>

  <!-- Border Outline -->
  <rect width="938" height="318" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Window Dot Controls -->
  <g transform="translate(24, 22)">
    <circle cx="0" cy="0" r="5.5" fill="#ef4444" opacity="0.85"/>
    <circle cx="18" cy="0" r="5.5" fill="#eab308" opacity="0.85"/>
    <circle cx="36" cy="0" r="5.5" fill="#22c55e" opacity="0.85"/>
    <text x="60" y="4" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.05em">DEVNOTE WORKSPACE • V1.1.0</text>
  </g>

  <!-- Brand Icon -->
  <g transform="translate(48, 68)">
    <rect width="60" height="60" rx="14" fill="#2563eb" filter="url(#shadow)"/>
    <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">D</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(126, 88)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="40" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.02em">DevNote</text>
    <text x="180" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.08em">LOCAL-FIRST &amp; HOSTED IPAD</text>
    <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#94a3b8">Interactive Developer Notebook, Real-Time Code Execution &amp; Apple Pencil Workspace</text>
  </g>

  <!-- Feature Badge Pills -->
  <g transform="translate(48, 172)">
    <!-- Pill 1: Code Execution -->
    <g class="tag-hover" transform="translate(0, 0)">
      <rect width="186" height="32" rx="16" fill="url(#card-grad)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#22c55e"/>
      <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Python 3 &amp; JS Execution</text>
    </g>

    <!-- Pill 2: Apple Pencil -->
    <g class="tag-hover" transform="translate(196, 0)">
      <rect width="190" height="32" rx="16" fill="url(#card-grad)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#a855f7">✍️</text>
      <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Apple Pencil Dynamics</text>
    </g>

    <!-- Pill 3: Split Search -->
    <g class="tag-hover" transform="translate(396, 0)">
      <rect width="202" height="32" rx="16" fill="url(#card-grad)" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#06b6d4">🔍</text>
      <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">50% Split Search Panel</text>
    </g>

    <!-- Pill 4: Round-Trip PDF -->
    <g class="tag-hover" transform="translate(608, 0)">
      <rect width="216" height="32" rx="16" fill="url(#card-grad)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#ec4899">📄</text>
      <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Lossless PDF Round-Trip</text>
    </g>
  </g>

  <!-- Interactive Terminal Card -->
  <g transform="translate(48, 226)">
    <rect width="844" height="64" rx="10" fill="#030712" stroke="#1f2937" stroke-width="1"/>
    
    <!-- Prompt Icon -->
    <text x="18" y="38" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#38bdf8">$</text>
    <text x="36" y="38" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#f8fafc">devnote start --host 0.0.0.0 --port 8080</text>
    <rect x="366" y="25" width="8" height="17" fill="#38bdf8" class="blink-cursor"/>

    <!-- Right Side Badges -->
    <rect x="670" y="18" width="80" height="26" rx="6" fill="#1e293b"/>
    <text x="710" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">100% Free</text>

    <rect x="760" y="18" width="70" height="26" rx="6" fill="#14532d"/>
    <text x="795" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">Zero Ads</text>
  </g>
</svg>
