<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 220" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
      .flow-dash {
        stroke-dasharray: 6, 6;
        animation: flowDash 1.2s linear infinite;
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -12; }
      }
    </style>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="940" height="220" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1.2"/>

  <!-- Step 1: Canonical SQLite -->
  <g transform="translate(30, 36)">
    <rect width="190" height="148" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="14" y="16" width="32" height="32" rx="6" fill="#0284c7"/>
    <text x="30" y="38" class="sans" font-size="16" fill="#ffffff" text-anchor="middle">💾</text>
    <text x="56" y="30" class="sans" font-size="12" font-weight="700" fill="#f8fafc">1. Local SQLite</text>
    <text x="56" y="44" class="sans" font-size="10" fill="#38bdf8">WAL Concurrency</text>
    <text x="14" y="74" class="sans" font-size="10.5" fill="#94a3b8">Persistent document storage.</text>
    <text x="14" y="92" class="sans" font-size="10.5" fill="#94a3b8">Stable UUID per notebook.</text>
    <text x="14" y="110" class="sans" font-size="10.5" fill="#94a3b8">Debounced 800ms autosave.</text>
    <rect x="14" y="124" width="162" height="18" rx="4" fill="#0369a1" opacity="0.3"/>
    <text x="95" y="137" class="mono" font-size="9" font-weight="600" fill="#38bdf8" text-anchor="middle">Canonical Record</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 225 110 L 260 110" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-dash" marker-end="url(#arrow)"/>

  <!-- Step 2: Lossless PDF Export -->
  <g transform="translate(265, 36)">
    <rect width="190" height="148" rx="10" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.2"/>
    <rect x="14" y="16" width="32" height="32" rx="6" fill="#7e22ce"/>
    <text x="30" y="38" class="sans" font-size="16" fill="#ffffff" text-anchor="middle">📄</text>
    <text x="56" y="30" class="sans" font-size="12" font-weight="700" fill="#f8fafc">2. PDF Export</text>
    <text x="56" y="44" class="sans" font-size="10" fill="#c084fc">PyMuPDF Engine</text>
    <text x="14" y="74" class="sans" font-size="10.5" fill="#94a3b8">Syntax-highlighted code.</text>
    <text x="14" y="92" class="sans" font-size="10.5" fill="#94a3b8">Terminal execution logs.</text>
    <text x="14" y="110" class="sans" font-size="10.5" fill="#94a3b8">Apple Pencil sketch images.</text>
    <rect x="14" y="124" width="162" height="18" rx="4" fill="#581c87" opacity="0.4"/>
    <text x="95" y="137" class="mono" font-size="9" font-weight="600" fill="#e9d5ff" text-anchor="middle">+ devnote_state.json</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 460 110 L 495 110" fill="none" stroke="#a855f7" stroke-width="2.5" class="flow-dash" marker-end="url(#arrow)"/>

  <!-- Step 3: Cross-Platform Share -->
  <g transform="translate(500, 36)">
    <rect width="180" height="148" rx="10" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.2"/>
    <rect x="14" y="16" width="32" height="32" rx="6" fill="#059669"/>
    <text x="30" y="38" class="sans" font-size="16" fill="#ffffff" text-anchor="middle">☁️</text>
    <text x="56" y="30" class="sans" font-size="12" font-weight="700" fill="#f8fafc">3. Share &amp; Move</text>
    <text x="56" y="44" class="sans" font-size="10" fill="#34d399">Mac / iPad / PC</text>
    <text x="14" y="74" class="sans" font-size="10.5" fill="#94a3b8">Transfer via AirDrop, LAN,</text>
    <text x="14" y="92" class="sans" font-size="10.5" fill="#94a3b8">USB drive, or Cloud host.</text>
    <text x="14" y="110" class="sans" font-size="10.5" fill="#94a3b8">Shared JSON or PDF file.</text>
    <rect x="14" y="124" width="152" height="18" rx="4" fill="#064e3b" opacity="0.4"/>
    <text x="90" y="137" class="mono" font-size="9" font-weight="600" fill="#6ee7b7" text-anchor="middle">Zero Lock-in</text>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M 685 110 L 720 110" fill="none" stroke="#10b981" stroke-width="2.5" class="flow-dash" marker-end="url(#arrow)"/>

  <!-- Step 4: Lossless Reopen -->
  <g transform="translate(725, 36)">
    <rect width="185" height="148" rx="10" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="14" y="16" width="32" height="32" rx="6" fill="#d97706"/>
    <text x="30" y="38" class="sans" font-size="16" fill="#ffffff" text-anchor="middle">🔄</text>
    <text x="56" y="30" class="sans" font-size="12" font-weight="700" fill="#f8fafc">4. Reconstruct</text>
    <text x="56" y="44" class="sans" font-size="10" fill="#fbbf24">Lossless Re-open</text>
    <text x="14" y="74" class="sans" font-size="10.5" fill="#94a3b8">100% blocks restored.</text>
    <text x="14" y="92" class="sans" font-size="10.5" fill="#94a3b8">Zero duplicate files.</text>
    <text x="14" y="110" class="sans" font-size="10.5" fill="#94a3b8">Resume writing &amp; run code.</text>
    <rect x="14" y="124" width="157" height="18" rx="4" fill="#78350f" opacity="0.4"/>
    <text x="92" y="137" class="mono" font-size="9" font-weight="600" fill="#fde68a" text-anchor="middle">100% Fidelity</text>
  </g>
</svg>
