<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
      .pulse-run {
        animation: pulseButton 2s infinite ease-in-out;
      }
      @keyframes pulseButton {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(37,99,235,0.4)); }
        50% { filter: drop-shadow(0 0 8px rgba(37,99,235,0.85)); }
      }
      .cursor-blink {
        animation: cursorBlink 1s step-end infinite;
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
    <filter id="win-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="curve-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- App Window Frame -->
  <g filter="url(#win-shadow)" transform="translate(10, 10)">
    <rect width="980" height="580" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- App Window Header Bar -->
    <rect width="980" height="44" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect width="980" height="12" y="32" fill="#f8fafc"/>

    <!-- Window Dots -->
    <circle cx="22" cy="22" r="5" fill="#ef4444"/>
    <circle cx="38" cy="22" r="5" fill="#eab308"/>
    <circle cx="54" cy="22" r="5" fill="#22c55e"/>

    <text x="500" y="26" class="sans" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">DevNote — Machine Learning &amp; Optimization.devnote</text>

    <!-- Right Window Controls -->
    <rect x="914" y="14" width="50" height="18" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="939" y="27" class="sans" font-size="9" font-weight="700" fill="#2563eb" text-anchor="middle">IPAD / PRO</text>

    <!-- ==========================================
         COLUMN 1: Left Navigation Sidebar (210px)
         ========================================== -->
    <g transform="translate(0, 44)">
      <rect width="210" height="536" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Brand -->
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#2563eb"/>
      <text x="26" y="31" class="sans" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>
      <text x="46" y="31" class="sans" font-size="14" font-weight="700" fill="#0f172a">DevNote</text>

      <!-- New Notebook Button -->
      <rect x="14" y="48" width="182" height="30" rx="6" fill="#2563eb"/>
      <text x="105" y="68" class="sans" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">+ New Notebook</text>

      <!-- Nav Items -->
      <g transform="translate(14, 90)">
        <rect width="182" height="26" rx="4" fill="#f1f5f9"/>
        <text x="10" y="18" class="sans" font-size="11" font-weight="700" fill="#2563eb">📓 My Notebooks</text>

        <text x="10" y="44" class="sans" font-size="11" font-weight="500" fill="#64748b">🕒 Recent Notebooks</text>
        <text x="10" y="68" class="sans" font-size="11" font-weight="500" fill="#64748b">🔍 Developer Search</text>
        <text x="10" y="92" class="sans" font-size="11" font-weight="500" fill="#64748b">💻 Code Snippets</text>
        <text x="10" y="116" class="sans" font-size="11" font-weight="500" fill="#64748b">📄 Import PDF / JSON</text>
      </g>

      <!-- Notebook List Header -->
      <text x="16" y="240" class="sans" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">NOTEBOOKS</text>

      <!-- Notebook Cards -->
      <g transform="translate(14, 252)">
        <rect width="182" height="48" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
        <text x="10" y="18" class="sans" font-size="11.5" font-weight="600" fill="#2563eb">ML &amp; Optimization</text>
        <rect x="144" y="8" width="28" height="14" rx="3" fill="#eff6ff"/>
        <text x="158" y="18" class="sans" font-size="8.5" font-weight="700" fill="#2563eb" text-anchor="middle">PDF</text>
        <text x="10" y="36" class="sans" font-size="9.5" fill="#94a3b8">6 blocks • Today</text>
      </g>

      <g transform="translate(14, 306)">
        <rect width="182" height="42" rx="6" fill="transparent"/>
        <text x="10" y="16" class="sans" font-size="11.5" font-weight="500" fill="#334155">Quantum Computing</text>
        <text x="10" y="32" class="sans" font-size="9.5" fill="#94a3b8">4 blocks • Yesterday</text>
      </g>

      <!-- Sidebar Footer (Theme Toggle) -->
      <rect x="0" y="496" width="210" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="521" class="sans" font-size="11" font-weight="500" fill="#64748b">🌙 Dark Mode</text>
      <text x="180" y="521" class="sans" font-size="10" fill="#94a3b8">v1.1.0</text>
    </g>

    <!-- ==========================================
         COLUMN 2: 50% Developer Search Panel (380px)
         ========================================== -->
    <g transform="translate(210, 44)">
      <rect width="380" height="536" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Search Header -->
      <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#0f172a">Developer Search Workspace</text>
      <text x="350" y="24" class="sans" font-size="12" fill="#94a3b8">✕</text>

      <!-- Search Input -->
      <g transform="translate(14, 34)">
        <rect width="352" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="20" class="sans" font-size="12" fill="#2563eb">🔍</text>
        <text x="32" y="20" class="sans" font-size="12" fill="#0f172a">python decorators</text>
        <rect x="146" y="8" width="2" height="16" fill="#2563eb" class="cursor-blink"/>
      </g>

      <!-- Category Filter Pills -->
      <g transform="translate(14, 76)">
        <rect width="34" height="20" rx="10" fill="#2563eb"/>
        <text x="17" y="14" class="sans" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle">All</text>

        <rect x="40" y="0" width="60" height="20" rx="10" fill="#e2e8f0"/>
        <text x="70" y="14" class="sans" font-size="9.5" font-weight="500" fill="#475569" text-anchor="middle">Concepts</text>

        <rect x="106" y="0" width="68" height="20" rx="10" fill="#e2e8f0"/>
        <text x="140" y="14" class="sans" font-size="9.5" font-weight="500" fill="#475569" text-anchor="middle">Error Fixes</text>

        <rect x="180" y="0" width="46" height="20" rx="10" fill="#e2e8f0"/>
        <text x="203" y="14" class="sans" font-size="9.5" font-weight="500" fill="#475569" text-anchor="middle">Code</text>

        <rect x="232" y="0" width="46" height="20" rx="10" fill="#e2e8f0"/>
        <text x="255" y="14" class="sans" font-size="9.5" font-weight="500" fill="#475569" text-anchor="middle">Docs</text>
      </g>

      <!-- Search Result Card 1 -->
      <g transform="translate(14, 108)">
        <rect width="352" height="156" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="14" y="22" class="sans" font-size="12" font-weight="700" fill="#0f172a">Python Decorators</text>
        <rect x="272" y="10" width="66" height="16" rx="8" fill="#f1f5f9"/>
        <text x="305" y="22" class="sans" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">CONCEPT</text>

        <text x="14" y="42" class="sans" font-size="10.5" fill="#475569">A callable that extends another function dynamically.</text>

        <!-- Code Snippet Box -->
        <rect x="14" y="54" width="324" height="60" rx="4" fill="#0f172a"/>
        <text x="22" y="72" class="mono" font-size="9" fill="#38bdf8">@functools.wraps(func)</text>
        <text x="22" y="86" class="mono" font-size="9" fill="#f8fafc">def timer(*args): ...</text>
        <text x="22" y="100" class="mono" font-size="9" fill="#a7f3d0">print(f"Executed in {t}s")</text>

        <!-- Card Action Footer -->
        <text x="14" y="138" class="sans" font-size="9.5" fill="#94a3b8">Python 3 Docs</text>
        
        <rect x="206" y="122" width="132" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
        <text x="272" y="137" class="sans" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">+ Insert into Notebook</text>
      </g>

      <!-- Search Result Card 2 -->
      <g transform="translate(14, 276)">
        <rect width="352" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="14" y="22" class="sans" font-size="12" font-weight="700" fill="#0f172a">TypeError: 'NoneType' object is not subscriptable</text>
        <rect x="290" y="10" width="48" height="16" rx="8" fill="#fef2f2"/>
        <text x="314" y="22" class="sans" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">ERROR</text>

        <text x="14" y="42" class="sans" font-size="10.5" fill="#475569">Occurs when indexing data[key] on a None value.</text>
        
        <rect x="206" y="74" width="132" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
        <text x="272" y="89" class="sans" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">+ Insert into Notebook</text>
      </g>
    </g>

    <!-- Draggable Divider -->
    <rect x="590" y="44" width="5" height="536" fill="#cbd5e1"/>
    <circle cx="592.5" cy="312" r="3" fill="#64748b"/>

    <!-- ==========================================
         COLUMN 3: Main Notebook Workspace (385px)
         ========================================== -->
    <g transform="translate(595, 44)">
      <!-- Editor Top Bar -->
      <rect width="385" height="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="23" class="sans" font-size="13" font-weight="700" fill="#0f172a">ML &amp; Optimization</text>

      <!-- Autosave Status -->
      <circle cx="170" cy="19" r="3.5" fill="#22c55e"/>
      <text x="180" y="23" class="sans" font-size="10" fill="#64748b">All changes saved</text>

      <rect x="286" y="8" width="40" height="22" rx="4" fill="#f1f5f9"/>
      <text x="306" y="22" class="sans" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">JSON</text>

      <rect x="330" y="8" width="46" height="22" rx="4" fill="#2563eb"/>
      <text x="353" y="22" class="sans" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle">PDF</text>

      <!-- Notebook Body Content -->
      <g transform="translate(16, 50)">
        <!-- Heading 1 -->
        <text x="0" y="16" class="sans" font-size="16" font-weight="800" fill="#0f172a">Gradient Descent Parameter Update</text>

        <!-- Paragraph -->
        <text x="0" y="34" class="sans" font-size="11" fill="#475569">The parameter step reduces the loss proportionally to the gradient.</text>

        <!-- Executable Code Block -->
        <g transform="translate(0, 46)">
          <rect width="352" height="142" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          
          <!-- Code Block Header -->
          <rect width="352" height="26" rx="6" fill="#f1f5f9"/>
          <text x="10" y="17" class="sans" font-size="10" font-weight="700" fill="#2563eb">PYTHON 3</text>

          <!-- Done Pill -->
          <circle cx="160" cy="13" r="3.5" fill="#22c55e"/>
          <text x="170" y="17" class="sans" font-size="9.5" font-weight="600" fill="#16a34a">Done (18.4ms)</text>

          <!-- Run Button -->
          <rect x="296" y="4" width="48" height="18" rx="4" fill="#2563eb" class="pulse-run"/>
          <text x="320" y="16" class="sans" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">▶ RUN</text>

          <!-- Code Text -->
          <text x="12" y="44" class="mono" font-size="9.5" fill="#0f172a">w = 10.0; lr = 0.01; grad = 3.5</text>
          <text x="12" y="58" class="mono" font-size="9.5" fill="#0f172a">w = w - lr * grad</text>
          <text x="12" y="72" class="mono" font-size="9.5" fill="#0f172a">print(f"Updated Weight: {w:.4f}")</text>

          <!-- Output Terminal Box -->
          <rect x="0" y="84" width="352" height="58" fill="#0f172a"/>
          <text x="10" y="98" class="sans" font-size="8" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">TERMINAL OUTPUT (18.4MS)</text>
          <text x="10" y="116" class="mono" font-size="10" fill="#4ade80">Updated Weight: 9.9650</text>
          <text x="10" y="130" class="mono" font-size="9" fill="#94a3b8">[Execution finished successfully]</text>
        </g>

        <!-- Handwritten Canvas Block -->
        <g transform="translate(0, 202)">
          <rect width="352" height="136" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          
          <!-- Drawing Toolbar -->
          <rect width="352" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="8" y="16" class="sans" font-size="9" font-weight="700" fill="#64748b">APPLE PENCIL SKETCH</text>
          <circle cx="260" cy="12" r="5" fill="#2563eb"/>
          <circle cx="276" cy="12" r="5" fill="#dc2626"/>
          <circle cx="292" cy="12" r="5" fill="#16a34a"/>
          <text x="320" y="16" class="sans" font-size="9" fill="#64748b">2.5px</text>

          <!-- Dynamic Stylus Strokes -->
          <path d="M 20 110 Q 80 120, 140 70 T 260 40 T 330 35" fill="none" stroke="url(#curve-gradient)" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M 140 70 L 150 48" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
          <text x="156" y="52" class="sans" font-size="9" font-weight="700" fill="#dc2626">Minimum Loss θ*</text>
          <text x="20" y="122" class="sans" font-size="8.5" fill="#94a3b8">Loss Curve (Pressure Sensitive)</text>
        </g>
      </g>
    </g>
  </g>
</svg>
